<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website widget | relinqo</title>
    <meta name="description" content="Live relinqo website widget test page." />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="stylesheet" href="/ui/styles.css?v=20260527-polish" />
    <link rel="stylesheet" href="/ui/marketing.css?v=20260529-site-opt" />
    <style>
      .lr-widget-page {
        min-height: 100vh;
      }

      .lr-widget-shell {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 54px 0 82px;
      }

      .lr-widget-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.82fr) minmax(340px, 1fr);
        gap: 32px;
        align-items: start;
      }

      .lr-widget-intro {
        padding-top: 14px;
      }

      .lr-widget-intro h1 {
        max-width: 520px;
        font-size: 3rem;
        line-height: 1.05;
      }

      .lr-widget-intro p:not(.lr-kicker) {
        max-width: 560px;
        margin-top: 16px;
        color: var(--lr-ink-soft);
        font-size: 1.04rem;
        line-height: 1.68;
      }

      .lr-widget-frame {
        padding: 20px;
        border: 1px solid var(--lr-line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.97);
        box-shadow: var(--lr-shadow);
      }

      .lr-widget-frame [data-relinqo-widget] {
        min-height: 420px;
      }

      @media (max-width: 820px) {
        .lr-widget-grid {
          grid-template-columns: 1fr;
        }

        .lr-widget-intro h1 {
          font-size: 2.3rem;
        }
      }
    </style>
  </head>

  <body class="lr-page lr-widget-page">
    <header class="lr-nav">
      <div class="lr-container lr-nav-inner">
        <a class="lr-brand" href="/" aria-label="relinqo home">
          <span class="lr-brand-mark">rl</span>
          <span>relinqo</span>
        </a>
        <nav class="lr-nav-links" aria-label="Primary navigation">
          <a href="/">Home</a>
          <a href="/demo">Live demo</a>
          <a href="/settings">Settings</a>
        </nav>
        <div class="lr-nav-actions">
          <a class="lr-link" href="/login">Sign in</a>
          <a class="lr-btn lr-btn-primary" href="/settings">Open settings</a>
        </div>
      </div>
    </header>

    <main class="lr-widget-shell">
      <section class="lr-widget-grid">
        <div class="lr-widget-intro">
          <p class="lr-kicker">Website widget preview</p>
          <h1>Test the live website intake form.</h1>
          <p>Submissions from this page create leads in the reese-plumbing workspace, using the same public embed code a customer site would use.</p>
        </div>

        <div class="lr-widget-frame">
          <div data-relinqo-widget data-workspace="reese-plumbing" data-token="50dadb6e6459193ab4e2d4db5f994662"></div>
          <script src="https://www.relinqo.com/api/widget/embed.js" async></script>
        </div>
      </section>
    </main>
  </body>
</html>
